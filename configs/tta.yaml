# Test-time adaptation experiments (E3 HP selection, E4 benchmark, E5 failure analysis).
batch_size: 64
# Compute budget (2026-10-12: ~4 h total instead of 15-20 h): 2 seeds (ViT), 1 seed (ResNet),
# severities {3, 5}, core methods only for ResNet. See docs/03_experiments_log.md.
seeds: [0, 1]               # stream orders (and stochastic augmentations for CoTTA)

# Hyper-parameter selection: validation corruptions on S_val ONLY (never a test domain/corruption).
hp_selection:
  conditions:
    - "S_val:clean"
    - "S_val:speckle_noise_s3"
    - "S_val:speckle_noise_s5"
    - "S_val:gaussian_blur_s3"
    - "S_val:gaussian_blur_s5"
    - "S_val:spatter_s3"
    - "S_val:spatter_s5"
    - "S_val:saturate_s3"
    - "S_val:saturate_s5"
  seed: 0

# Grids (fixed values are the papers' defaults; see docstrings in src/birdshift/tta/)
grids:
  source: {}
  bn: {bn_prior: [0, 4, 16, 64, 256, 1024]}   # 64 was on the edge in the first ResNet-50 run
  # earlier grids stopped at lr = 0.003 then 0.03 and TENT's optimum was on the edge both times -> one wide
  # log-spaced grid for every SGD method (docs/03_experiments_log.md); select_hp flags optima on a grid edge
  tent: {lr: [0.0003, 0.001, 0.003, 0.01, 0.03, 0.1]}
  pl: {lr: [0.0003, 0.001, 0.003, 0.01, 0.03, 0.1], threshold: [0.7, 0.9]}
  eata: {lr: [0.0003, 0.001, 0.003, 0.01, 0.03, 0.1], d_margin: [0.05, 0.4]}
  sar: {lr: [0.0003, 0.001, 0.003, 0.01, 0.03, 0.1]}
  t3a: {filter_k: [1, 5, 20, 50, 100, -1]}
  lame: {knn: [1, 3, 5, 10, 20, 40]}   # 10 was on the edge in the first run
  # ap: augmentation is used when the anchor's mean batch confidence < ap. Without augmentation the teacher equals the
  # student at start and the soft cross-entropy has zero gradient, so CoTTA never moves (ap = 0.2 reproduced Source
  # exactly on our calibrated 100-class model, whose mean confidence is ~0.6). On ImageNet-C (1000 classes, ap = 0.1)
  # augmentation is almost always on, so ap in {0.5, 0.8, 1.01 = always} is the faithful regime here.
  # alpha: with the paper's teacher EMA 0.999, a 500-image stream (8 steps) leaves the teacher 99.2 % source, so
  # predictions did not depend on lr at all; CoTTA's alpha was set for ~1000-step ImageNet-C streams, ours are 8-16
  # steps per domain -> alpha 0.99 (as in Anchored TTA) is also searched
  cotta: {lr: [0.0003, 0.001, 0.003], ap: [0.5, 1.01], alpha: [0.99, 0.999]}
  rdumb: {lr: [0.0003, 0.001, 0.003, 0.01, 0.03, 0.1], d_margin: [0.05, 0.4]}
  anchored: {lr: [0.0003, 0.001, 0.003, 0.01, 0.03, 0.1], lambda_kl: [0.3, 1.0, 3.0]}

# Per-backbone overrides (compute budget: ResNet-50 TTA is ~2-4x slower on the RTX 2050). Ranges cover the usual
# SGD learning rates for BatchNorm models (TENT: 2.5e-4 at batch 64 on ImageNet-C). `inherit` copies the selected
# HPs of another method: RDumb uses EATA's loss and settings in its paper (Press et al. 2023, Sec. 4).
grid_overrides:
  vit_s16: &vit_overrides
    pl: {lr: [0.0003, 0.001, 0.003, 0.01, 0.03, 0.1, 0.3, 1.0], threshold: [0.7, 0.9]}   # 0.1 was on the edge
    # budget: the completed ViT grids put every SGD optimum in [0.01, 0.1], and CoTTA with ap = 0.5 ~ Source
    cotta: {lr: [0.001, 0.003], ap: [1.01], alpha: [0.99, 0.999]}
    rdumb: {inherit: eata}
    anchored: {lr: [0.003, 0.01, 0.03, 0.1], lambda_kl: [0.3, 1.0, 3.0]}
  dinov2:   # same LayerNorm ViT family -> same grids, except Anchored: lambda_kl = 0.3 was on the lower edge
    <<: *vit_overrides
    anchored: {lr: [0.003, 0.01, 0.03, 0.1], lambda_kl: [0.1, 0.3, 1.0, 3.0]}
  resnet50:
    bn: {bn_prior: [0, 16, 64, 256]}
    tent: {lr: [0.0003, 0.001, 0.003, 0.01]}
    pl: {lr: [0.0003, 0.001, 0.003, 0.01], threshold: [0.7]}
    eata: {lr: [0.0003, 0.001, 0.003, 0.01], d_margin: [0.05]}
    sar: {lr: [0.0003, 0.001, 0.003, 0.01, 0.03]}
    cotta: {lr: [0.0003, 0.001, 0.003], ap: [1.01], alpha: [0.99]}
    rdumb: {inherit: eata}
    anchored: {lr: [0.0003, 0.001, 0.003, 0.01], lambda_kl: [1.0, 3.0]}

fixed:
  eata: {fisher_alpha: 2000.0, e0_factor: 0.4}
  rdumb: {reset_every: 1000, e0_factor: 0.4}
  sar: {rho: 0.05, e0_factor: 0.4, reset_ema: 0.2}
  cotta: {n_aug: 8, rst: 0.01}
  anchored: {lambda_l2: 1.0, alpha: 0.99, e0_factor: 0.4}

# E4 benchmark conditions: 4 seasonal domains (natural shift) + 8 corruptions x severities {1,3,5} on S_test
benchmark:
  seasonal: ["S_test:clean", "A_test:clean", "W_test:clean", "P_test:clean"]
  corruption_severities: [3, 5]
  methods: [source, bn, tent, pl, eata, sar, t3a, lame, cotta, rdumb, anchored, geo_tent, geo_eata, geo_anchored]
  # compute budget: ResNet-50 is 2-4x slower on the RTX 2050 -> 1 seed, core methods (BN vs LN contrast)
  seeds_override: {resnet50: [0]}
  methods_override: {resnet50: [source, bn, tent, eata, geo_eata]}

# E5 failure analysis (budget < 4 h): batch-size sweep on ResNet (BatchNorm), non-i.i.d. streams on ViT
failure:
  batch_methods: [source, bn, tent]
  batch_sizes: [8, 64]
  noniid_methods: {vit_s16: [source, tent, eata, lame, anchored], dinov2: [source, tent, eata, lame, anchored], resnet50: []}
