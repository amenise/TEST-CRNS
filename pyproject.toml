[project]
name = "birdshift"
version = "0.1.0"
description = "Adaptive bird recognition under seasonal and synthetic distribution shifts: TTA, continual TTA and geo-temporal priors."
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "timm>=1.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pillow>=10",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "pyyaml>=6",
    "tqdm>=4.66",
    "truststore>=0.10",
    "pypdf>=5",
    "tabulate>=0.10.0",
    "open-clip-torch>=3.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "python-pptx>=1.0",
    "pymupdf>=1.28.2",
    "ruff>=0.17.1",
    "python-docx>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/birdshift"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks", "papers/download_papers.py"]

[tool.ruff.lint]
# pyflakes + pycodestyle errors, import order, bugbear (likely bugs), pyupgrade
select = ["F", "E", "W", "I", "B", "UP"]
ignore = [
    "E731", "E741",  # lambdas and short names like `l` are used deliberately in numeric code
    "E501",          # line length is enforced by `ruff format`; remaining long lines are strings and comments
    "B905",          # zip() over arrays that have equal length by construction; strict=True would change behaviour
]

[tool.ruff.lint.isort]
known-first-party = ["birdshift"]
